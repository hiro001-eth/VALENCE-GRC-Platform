version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: valence_db
    profiles: ["production"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valence_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-valence_grc}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valence_admin -d valence_grc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["production"]
    image: redis:7-alpine
    container_name: valence_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: valence_api
    profiles: ["production"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://valence_admin:CHANGE_ME_DB_PASSWORD@db:5432/valence_grc}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-valence-grc-enterprise-secret-CHANGE-IN-PRODUCTION-minimum-32-chars}
      - VALENCE_ENV=${VALENCE_ENV:-development}
      - VALENCE_FORCE_HSTS=${VALENCE_FORCE_HSTS:-false}
      - VALENCE_SHOW_DEMO_CREDENTIALS=${VALENCE_SHOW_DEMO_CREDENTIALS:-true}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://grc.yourcompany.com}
      - SIEM_DEMO_MODE=${SIEM_DEMO_MODE:-false}
      # SSO — set AUTH_SSO_ENABLED=true in .env and configure your IdP
      - AUTH_SSO_ENABLED=${AUTH_SSO_ENABLED:-false}
      - AUTH_SSO_PROVIDER=${AUTH_SSO_PROVIDER:-azure}
      - AUTH_AZURE_TENANT_ID=${AUTH_AZURE_TENANT_ID:-}
      - AUTH_OKTA_DOMAIN=${AUTH_OKTA_DOMAIN:-}
      - AUTH_OKTA_AUTH_SERVER=${AUTH_OKTA_AUTH_SERVER:-default}
      - AUTH_OIDC_CLIENT_ID=${AUTH_OIDC_CLIENT_ID:-}
      - AUTH_OIDC_CLIENT_SECRET=${AUTH_OIDC_CLIENT_SECRET:-}
      - AUTH_OIDC_ISSUER_URL=${AUTH_OIDC_ISSUER_URL:-}
      - AUTH_OIDC_REDIRECT_URI=${AUTH_OIDC_REDIRECT_URI:-https://localhost/api/auth/sso/callback}
      - AUTH_OIDC_SCOPES=${AUTH_OIDC_SCOPES:-}
      - AUTH_SSO_DEFAULT_ROLE=${AUTH_SSO_DEFAULT_ROLE:-analyst}
      - AUTH_SSO_GROUP_ROLE_MAP=${AUTH_SSO_GROUP_ROLE_MAP:-}
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./rules:/app/rules
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    profiles: ["production"]
    image: nginx:alpine
    container_name: valence_nginx
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
      - ./nginx/valence.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    entrypoint: >
      /bin/sh -c "
        apk add --no-cache openssl &&
        mkdir -p /etc/nginx/certs &&
        if [ ! -f /etc/nginx/certs/valence.crt ]; then
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /etc/nginx/certs/valence.key \
            -out /etc/nginx/certs/valence.crt \
            -subj '/CN=valence-grc.local';
        fi &&
        exec nginx -g 'daemon off;'
      "

  mock_siem:
    profiles: ["demo"]
    image: python:3.11-slim
    container_name: valence_mock_siem
    volumes:
      - ./tests/fixtures:/fixtures
    command: >
      bash -c "pip install fastapi uvicorn && 
               echo 'from fastapi import FastAPI; import json; app = FastAPI(); @app.get(\"/_search\")\ndef search(): return json.load(open(\"/fixtures/mock_siem_response.json\")); @app.get(\"/health\")\ndef health(): return {\"status\": \"ok\"}' > main.py && 
               uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8081:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    entrypoint: >
      bash -c "apt-get update && apt-get install -y curl && exec \"$$@\""

volumes:
  postgres_data:
