# Industry benchmark percentiles — sourced from published security research.
# Update quarterly; cite sources in API responses.
version: "2025-Q2"
last_updated: "2025-06-01"
methodology: |
  Percentiles (p25/p50/p75/p90) derived from Verizon DBIR 2025, SANS 2024 SOC Survey,
  Ponemon Cost of Data Breach 2024, and CrowdStrike Global Threat Report 2025.
  Lower-is-better metrics: MTTD, MTTR, FPR, CVE patch lag, DLP incidents.
  Higher-is-better: privileged access review completion %.

