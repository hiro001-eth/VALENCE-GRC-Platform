    description: "Access authorization and establishment/modification."
    metric_ids: ["KPI-PHI-001"]
  - id: "HIPAA-164.308(a)(5)"
    title: "Security Awareness Training"
    description: "Security reminders and protection from malicious software."
    metric_ids: ["KRI-CVE-001"]
  - id: "HIPAA-164.308(a)(6)"
