# Unified controls mapped across SOC2, ISO27001, HIPAA, GDPR, NIST CSF, PCI DSS,
# DORA, FedRAMP, CMMC, and NIS2.
# Each UCF entry maps a single security objective to the equivalent control ID in
# every supported framework, enabling cross-framework gap closure at a glance.
unified_controls:
