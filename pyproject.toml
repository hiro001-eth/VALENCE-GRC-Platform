[project]
name = "grc-dashboard"
version = "3.0.0"
description = "VALENCE: Enterprise Security Metrics, Risk Quantification & Compliance Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "aiohttp>=3.9.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "polars>=0.20.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
    "structlog>=24.1.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.3.0",
    # API Layer
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # HTTP / Alerting
    "httpx>=0.27.0",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
]
redis = [
    "redis>=5.0.0",
]
email = [
    "aiosmtplib>=3.0.0",
]
siem = [
    "elasticsearch[async]>=8.13.0",
]
billing = [
    "stripe>=9.0.0",
]
cloud = [
    "boto3>=1.34.0",
]
e2e = [
    "pytest-playwright>=0.5.0",
    "playwright>=1.44.0",
]
worker = [
    "celery>=5.3.0",
]
dev = [
    "mypy>=1.9.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "celery>=5.3.0",
    "types-PyYAML",
    "types-passlib",
    "types-python-jose",
]
test = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=5.0.0",
    "aioresponses>=0.7.6",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
]

[project.scripts]
valence = "grc_dashboard.main:app"
valence-api = "grc_dashboard.api.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: Playwright browser tests (run separately)",
]

[tool.mypy]
# Disabled strict mode and suppressed noisy error codes for development convenience
strict = false
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
# Suppress specific mypy error codes that are currently noisy in this codebase
disable_error_code = [
    "type-arg",
    "attr-defined",
    "no-untyped-def",
    "call-overload",
    "assignment",
    "operator",
    "arg-type",
    "unused-ignore",
    "list-item",
    "union-attr",
]


[tool.ruff]
select = ["E", "F", "I", "UP", "B", "SIM"]
line-length = 100
